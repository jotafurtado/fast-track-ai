<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title description">
  <title id="title">Fast Track AI: fluxo numerado entre você e o agente</title>
  <desc id="description">Após /ft-init, você inicia com /ft-intent. O Agente de IA documenta a intenção; você revisa intent.md. /ft-spec prepara o plano; você revisa e aprova. /ft-implement executa com testes e revisão; você confirma a conclusão. As barras ilustram a chamada no Claude Code; no Codex, use $ seguido do nome da skill. Revise os artefatos antes de continuar.</desc>
  <style>
    svg { --fg:#20213e; --muted:#68758e; --border:#dfe6f2; --surface:#ffffff; --accent:#4b25bd; --success:#27876e; --c1:#4b25bd; --c2:#6795e8; --c3:#df654a; --c4:#bfe7dc; --c5:#edf3fc; --c6:#d9cdf6; color:var(--fg); font-family:"Avenir Next","Trebuchet MS",sans-serif; }
    .brand {font-size:25px;font-weight:650;letter-spacing:-.6px;fill:var(--fg)}
    .heading {font-size:46px;font-weight:700;letter-spacing:-1.5px;fill:var(--fg)}
    .intro {font-size:23px;font-weight:400;fill:var(--muted)}
    .lane {font-size:25px;font-weight:650;fill:var(--fg)}
    .human-label {font-size:36px;font-weight:700;letter-spacing:-.7px;fill:var(--fg);text-anchor:middle}
    .hint {font-size:22px;fill:var(--muted);text-anchor:middle}
    .command {font-family:ui-monospace,monospace;font-size:22px;fill:var(--c1);text-anchor:middle}
    .stage-label {font-size:36px;font-weight:700;letter-spacing:-.7px;fill:var(--fg);text-anchor:middle}
    .stage-detail {font-size:24px;fill:var(--muted);text-anchor:middle}
    .route {fill:none;stroke:var(--c3);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .footer {font-size:24px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="var(--c3)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="platform">
      <ellipse cx="9" cy="34" rx="174" ry="50" fill="var(--c2)" opacity=".09"/>
      <path d="M-160 -36 L-20 44 L172 -20 L172 -2 L-20 62 L-160 -18 Z" fill="var(--c2)" opacity=".8"/>
      <path d="M-20 44 L172 -20 L172 -2 L-20 62 Z" fill="var(--c1)" opacity=".86"/>
      <path d="M-160 -36 L32 -100 L172 -20 L-20 44 Z" fill="var(--surface)" stroke="var(--border)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-126 -27 L23 -77" stroke="var(--c6)" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="review-control">
      <ellipse cx="0" cy="12" rx="48" ry="45" fill="var(--c3)" opacity=".1"/>
      <circle r="45" fill="var(--surface)" stroke="var(--c3)" stroke-width="2.5"/>
      <path d="M-18 -23 H7 L18 -12 V22 H-18 Z M7 -23 V-12 H18 M-9 -6 H4 M-9 3 H0 M-9 12 H-3" fill="none" stroke="var(--c3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="11" cy="10" r="10" fill="var(--surface)" stroke="var(--c3)" stroke-width="2.5"/>
      <path d="M18 17 L26 25" stroke="var(--c3)" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </defs>

  <text class="brand" x="72" y="63">Fast Track AI</text>
  <text class="heading" x="72" y="126">Você Decide. A IA Implementa.</text>
  <text class="intro" x="73" y="166">Depois de instalar e dar init, siga o ciclo de uma mudança.</text>
  <text class="command" x="1527" y="166" style="text-anchor:end">Antes: /ft-init</text>

  <rect x="58" y="204" width="1486" height="292" rx="18" fill="var(--c3)" fill-opacity=".035" stroke="var(--border)" stroke-width="1.5"/>
  <rect x="58" y="514" width="1486" height="488" rx="18" fill="var(--c1)" fill-opacity=".025" stroke="var(--border)" stroke-width="1.5"/>

  <g aria-label="Responsabilidade do usuário">
    <circle cx="85" cy="229" r="11" fill="var(--c3)"/>
    <text class="lane" x="109" y="237">Você: Pede, Revisa e Aprova</text>
    <path d="M478 229 H1527" stroke="var(--border)" stroke-width="1.5"/>
  </g>
  <g aria-label="Responsabilidade do agente">
    <path d="M75 535 L86 524 L97 535 L86 546 Z" fill="var(--c1)"/>
    <text class="lane" x="109" y="543">Agente de IA</text>
  </g>
  <g stroke="var(--border)" stroke-width="1" opacity=".46" fill="none">
    <path d="M76 612 H1528 M76 672 H1528 M76 732 H1528 M76 792 H1528"/>
    <path d="M155 591 V800 M275 591 V800 M395 591 V800 M515 591 V800 M635 591 V800 M755 591 V800 M875 591 V800 M995 591 V800 M1115 591 V800 M1235 591 V800 M1355 591 V800 M1475 591 V800"/>
  </g>

  <g aria-label="Caminho principal da mudança">
    <path class="route" data-from="request" data-to="intent" d="M276 309 C365 309 365 478 335 568"/>
    <path class="route" data-from="intent" data-to="advance" d="M419 619 C427 563 397 500 397 386 C397 340 450 310 512 310"/>
    <path class="route" data-from="advance" data-to="plan" d="M606 310 C716 310 800 495 800 568"/>
    <path class="route" data-from="plan" data-to="approve" d="M890 619 C898 563 868 500 868 386 C868 340 921 310 982 310"/>
    <path class="route" data-from="approve" data-to="implement" d="M1076 310 C1206 310 1260 495 1260 568"/>
    <path class="route" data-from="implement" data-to="finish" d="M1360 619 C1368 563 1295 500 1295 386 C1295 340 1348 310 1387 310"/>
    <path class="route" data-from="finish" data-to="complete" d="M1482 310 C1630 365 1580 740 1492 852"/>
  </g>

  <g data-step-id="request" transform="translate(47 0)" aria-label="Você inicia o pedido com ft-intent">
    <path d="M90 283 Q90 267 107 267 H211 Q229 267 229 285 V333 Q229 351 211 351 H161 L141 368 V351 H107 Q90 351 90 333 Z" fill="var(--c5)"/>
    <path d="M83 274 Q83 258 100 258 H204 Q222 258 222 276 V324 Q222 342 204 342 H155 L134 359 V342 H100 Q83 342 83 324 Z" fill="var(--surface)" stroke="var(--c2)" stroke-width="2.5"/>
    <path d="M108 282 H193 M108 299 H181 M108 316 H157" stroke="var(--c2)" stroke-width="6" stroke-linecap="round"/>
    <text class="human-label" x="153" y="395">1. Iniciar</text>
    <text class="hint" x="153" y="428">Descreva Seu Pedido</text>
    <text class="command" x="153" y="461">/ft-intent</text>
  </g>

  <g data-step-id="advance" transform="translate(560 310)" aria-label="Revisar intent.md antes de continuar ou enviar outra instrução">
    <use href="#review-control"/>
    <text class="human-label" y="84">3. Revisar</text>
    <text class="hint" y="114">intent.md</text>
  </g>
  <g data-step-id="approve" transform="translate(1030 310)" aria-label="Revisar e aprovar spec.md e tasks.md antes de implementar ou enviar outra instrução">
    <use href="#review-control"/>
    <text class="human-label" y="84">5. Aprovar</text>
    <text class="hint" y="114">spec.md e tasks.md</text>
  </g>
  <g data-step-id="finish" transform="translate(1435 310)" aria-label="Revisar a entrega e suas evidências antes de concluir ou enviar outra instrução">
    <use href="#review-control"/>
    <text class="human-label" y="84">7. Concluir</text>
    <text class="hint" y="114">Entrega e</text>
    <text class="hint" y="140">Evidências</text>
  </g>

  <g data-step-id="intent" transform="translate(335 693)" aria-label="O agente documenta a intenção e seus limites">
    <use href="#platform"/>
    <g transform="matrix(.82 -.27 .68 .4 -112 -88)">
      <rect x="15" y="17" width="176" height="187" rx="18" fill="var(--c6)" opacity=".54"/>
      <rect x="2" y="0" width="176" height="187" rx="18" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
      <rect x="2" y="0" width="176" height="48" rx="18" fill="var(--c1)"/>
      <path d="M2 26 H178 V48 H2" fill="var(--c1)"/>
      <path d="M34 22 H134" stroke="var(--surface)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="42" cy="80" r="12" fill="var(--c2)"/>
      <path d="M70 73 H145 M70 87 H129" stroke="var(--c2)" stroke-width="6" stroke-linecap="round"/>
      <path d="M30 118 H146 M30 135 H130 M30 152 H101" stroke="var(--border)" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text class="stage-label" y="145">2. Documentar</text>
    <text class="stage-detail" y="182">intenção e limites</text>
    <text class="command" y="214">/ft-intent</text>
  </g>

  <g data-step-id="plan" transform="translate(800 693)" aria-label="O agente planeja etapas e tarefas">
    <use href="#platform"/>
    <g transform="matrix(.82 -.27 .68 .4 -123 -84)">
      <rect x="19" y="13" width="165" height="173" rx="16" fill="var(--c6)"/>
      <rect x="0" y="0" width="154" height="175" rx="16" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
      <rect x="23" y="24" width="105" height="21" rx="10" fill="var(--c1)"/>
      <path d="M24 70 H119 M24 90 H107 M24 110 H115 M24 130 H88" stroke="var(--c2)" stroke-width="7" stroke-linecap="round"/>
      <rect x="96" y="54" width="121" height="148" rx="16" fill="var(--surface)" stroke="var(--c2)" stroke-width="2"/>
      <rect x="115" y="73" width="80" height="15" rx="7" fill="var(--c2)"/>
      <rect x="114" y="105" width="12" height="12" rx="3" fill="var(--c6)"/>
      <rect x="114" y="134" width="12" height="12" rx="3" fill="var(--c6)"/>
      <rect x="114" y="163" width="12" height="12" rx="3" fill="var(--c6)"/>
      <path d="M138 111 H192 M138 140 H182 M138 169 H190" stroke="var(--c1)" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text class="stage-label" y="145">4. Planejar</text>
    <text class="stage-detail" y="182">etapas e tarefas</text>
    <text class="command" y="214">/ft-spec</text>
  </g>

  <g data-step-id="implement" transform="translate(1260 693)" aria-label="O agente implementa código com testes e revisão">
    <use href="#platform"/>
    <g transform="matrix(.82 -.27 .68 .4 -110 -84)">
      <rect x="14" y="18" width="192" height="180" rx="19" fill="var(--c6)"/>
      <rect x="0" y="0" width="192" height="180" rx="19" fill="var(--c1)"/>
      <circle cx="22" cy="22" r="5" fill="var(--surface)"/>
      <circle cx="40" cy="22" r="5" fill="var(--c2)"/>
      <circle cx="58" cy="22" r="5" fill="var(--c3)"/>
      <path d="M54 65 L33 82 L54 99 M138 65 L159 82 L138 99 M107 55 L85 110" fill="none" stroke="var(--surface)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M33 140 H143" stroke="var(--c2)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="176" cy="159" r="28" fill="var(--c4)"/>
      <path d="M161 158 L172 169 L191 146" fill="none" stroke="var(--success)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="stage-label" y="145">6. Implementar</text>
    <text class="stage-detail" y="182">código, testes e revisão</text>
    <text class="command" y="214">/ft-implement</text>
  </g>

  <g data-step-id="complete" transform="translate(1460 882)" aria-label="Mudança concluída, track encerrada">
    <circle r="38" fill="var(--c4)"/>
    <path d="M-18 -1 L-5 12 L20 -17" fill="none" stroke="var(--success)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="72" font-size="24" font-weight="650" text-anchor="middle" fill="var(--fg)">Mudança</text>
    <text x="0" y="102" font-size="24" font-weight="650" text-anchor="middle" fill="var(--fg)">Concluída</text>
  </g>

  <path d="M74 1020 H1527" stroke="var(--border)" stroke-width="1.5"/>
  <g class="footer" text-anchor="middle">
    <text x="310" y="1060" fill="var(--fg)" font-weight="650">Revise os Artefatos</text>
    <text x="310" y="1095">O contexto fica no projeto.</text>
    <text x="800" y="1060" fill="var(--fg)" font-weight="650">Escolha Como Seguir</text>
    <text x="800" y="1095">"." para avançar ou outra instrução.</text>
    <text x="1290" y="1060" fill="var(--fg)" font-weight="650">Conclua Quando Estiver Pronto</text>
    <text x="1290" y="1095">Sem push ou deploy automático.</text>
  </g>
</svg>
